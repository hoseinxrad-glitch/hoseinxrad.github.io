<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ایرگیم</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head><body>
<h1>ایرگیم</h1>
<p>کامپیوتر یا تلویزیون صفحه‌ی بازیه، گوشی‌ت دسته‌ست.</p>
<div class="row">
  <a class="btn" href="host.html">ساخت اتاق روی این صفحه</a>
  <p>یا با گوشی وارد شو:</p>
  <input id="code" maxlength="4" placeholder="کد اتاق" autocapitalize="characters">
  <button id="go">ورود به اتاق</button>
</div>
<script>
document.getElementById('go').onclick=()=>{
  const c=document.getElementById('code').value.trim().toUpperCase();
  if(c) location.href='controller.html?c='+c;
};
</script></body></html>
